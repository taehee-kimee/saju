id: INTJ
stack: Ni-Te-Fi-Se

dominant:
  function: Ni
  question: "세상을 어떻게 인식하는가?"
  core: "하나의 방향을 구조로 수렴한다"
  cognition:
    - 사건의 표면보다 '원인-결과의 줄기'를 먼저 잡는다
    - 여러 가능성을 넓히기보다, 가장 그럴듯한 한 방향으로 압축한다
    - 미래를 상상하기보다 '미래의 구조'를 설계한다
  risk:
    - 충분한 데이터 없이 결론을 너무 빨리 고정
    - 타인의 변수(감정/관계)를 과소평가

auxiliary:
  function: Te
  question: "판단을 어떻게 내리는가?"
  core: "효율과 논리로 결정한다"
  behavior:
    - 목표를 먼저 정의하고 역산한다
    - 감정보다 기준/지표/우선순위를 세운다
  conflict_seed: "정확한 구조 vs 느린 현실(사람/조직)"

tertiary:
  function: Fi
  unstable_when:
    - 자신의 기준이 무시될 때
    - '왜 해야 하는가'에 납득이 안 될 때
  reaction:
    - 조용히 선을 긋는다
    - 겉으로는 합리적이지만 내부 반감이 쌓인다

inferior:
  function: Se
  stress_response:
    - 단기 자극에 급격히 끌림(폭주/충동)
    - 디테일 집착 또는 감각 과부하
    - 계획을 깨는 즉흥 행동으로 균형을 맞추려 함

base_conflict: "미래 구조 확신 vs 현실 변수(사람/환경)"
external_result:
  - 전략적이고 냉정해 보임
  - 문제를 빠르게 구조화하고 방향을 제시함
  - 하지만 감정 공유/관계 조율은 늦게 반응할 수 있음

base_loop: "방향 수렴 → 계획 수립 → 실행 압박 → 감정 누락 → 스트레스 시 Se 폭발"
timing_hint:
  - '내가 다 설명했는데 왜 안 하지?'가 늘면, 변수(사람/맥락)를 놓치기 시작한 신호
  - 속도를 올릴수록 디테일이 거슬리기 시작하면 과부하 전조